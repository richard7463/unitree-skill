<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- deep near-black backdrop -->
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="55%" stop-color="#070a11"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <!-- blue -> cyan glow behind the mark -->
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1890ff" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#0fdae8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#0fdae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa8ff"/>
      <stop offset="100%" stop-color="#1890ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59c9ff"/>
      <stop offset="100%" stop-color="#0fdae8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="430" fill="url(#glow)"/>

  <!-- four-square mark, centered, cell 300 with 40 gap -->
  <g filter="url(#soft)" opacity=".55">
    <rect x="292" y="292" width="200" height="200" rx="46" fill="#1890ff"/>
    <rect x="532" y="532" width="200" height="200" rx="46" fill="#0fdae8"/>
  </g>
  <g>
    <rect x="292" y="292" width="200" height="200" rx="46" fill="url(#blue)"/>
    <rect x="532" y="292" width="200" height="200" rx="46" fill="url(#cyan)" opacity=".5"/>
    <rect x="292" y="532" width="200" height="200" rx="46" fill="url(#cyan)" opacity=".5"/>
    <rect x="532" y="532" width="200" height="200" rx="46" fill="url(#cyan)"/>
  </g>
</svg>
