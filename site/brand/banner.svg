<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="60%" stop-color="#070a11"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1890ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#1890ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="100%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#0fdae8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#0fdae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59c9ff"/>
      <stop offset="100%" stop-color="#0fdae8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa8ff"/>
      <stop offset="100%" stop-color="#1890ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59c9ff"/>
      <stop offset="100%" stop-color="#0fdae8"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#glowL)"/>
  <rect width="1500" height="500" fill="url(#glowR)"/>

  <!-- mark -->
  <g transform="translate(120,190)">
    <rect x="0"  y="0"  width="52" height="52" rx="13" fill="url(#blue)"/>
    <rect x="62" y="0"  width="52" height="52" rx="13" fill="url(#cyan)" opacity=".5"/>
    <rect x="0"  y="62" width="52" height="52" rx="13" fill="url(#cyan)" opacity=".5"/>
    <rect x="62" y="62" width="52" height="52" rx="13" fill="url(#cyan)"/>
  </g>

  <text x="120" y="250" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="72" fill="#f2f6ff" letter-spacing="-2">Talk to your robot.</text>
  <text x="120" y="330" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="72" letter-spacing="-2" fill="url(#grad)">In plain English.</text>
  <text x="122" y="392" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="26" fill="#93a4bf" letter-spacing="1">on-chain intent in  ·  real-world motion out  ·  fail-closed by design</text>
</svg>
